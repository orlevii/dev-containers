name: build-images

on:
  push:
    branches:
      - "main"
      - "*"
run-name: build-images

env:
  REGISTRY_IMAGE: "orlevi/dev-containers"

jobs:
  build-python:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "ubuntu-22.04-arm"]
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - run: python scripts/prepare_dockerfile.py
      - run: arch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      # - name: Build and push
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: "."
      #     build-args: |
      #       PYENV_VER=v2.6.3
      #       INSTALL_PYTHON_VERSION=${{ matrix.python-version }}
      #       POETRY_VERSION=2.1.3
      #     push: true
      #     platforms: linux/amd64,linux/arm64
      #     tags: "orlevi/dev-containers:python${{ matrix.python-version }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: "."
          tags: ${{ env.REGISTRY_IMAGE }}
          build-args: |
            PYENV_VER=v2.6.3
            INSTALL_PYTHON_VERSION=${{ matrix.python-version }}
            POETRY_VERSION=2.1.3
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Prepare
        run: |
          echo "ARCH=$(arch)" >> $GITHUB_ENV
          
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.python-version }}-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build-python
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.python-version }}-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
